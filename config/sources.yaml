# Sources: what to crawl.
# Each source has a list of targets and a scan cadence.

reddit:
  enabled: true
  scan_interval_sec: 180
  # Deep fetch (full text, top comments) for top-N candidates
  deep_fetch_top_n: 20
  subreddits:
    # Story-oriented RU-friendly via translation
    - name: AskReddit
      sort: [new, rising]
      min_upvotes: 50
    - name: tifu
      sort: [hot, new]
    - name: TrueOffMyChest
      sort: [hot, new]
    - name: AmItheAsshole
      sort: [hot]
    - name: relationship_advice
      sort: [hot]
    - name: MaliciousCompliance
      sort: [hot]
    - name: pettyrevenge
      sort: [hot]
    - name: ProRevenge
      sort: [hot]
    - name: confession
      sort: [hot]
    - name: LetsNotMeet
      sort: [hot]
    # Russian-speaking
    - name: Pikabu
      sort: [hot, new]
    - name: ru
      sort: [hot]

twitter:
  enabled: true
  scan_interval_sec: 300
  queries:
    # Search queries (twscrape .search())
    - "min_faves:500 lang:ru"
    - "виральный OR трогательная история lang:ru"
    - '"storytime" OR "story time" lang:en min_faves:1000'
  accounts: []  # specific @handles to monitor

threads:
  enabled: false  # needs Playwright session; flip after running setup_auth
  scan_interval_sec: 600
  users: []      # @handles
  hashtags: []
